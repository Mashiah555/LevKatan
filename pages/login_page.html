<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לב קטן - התחברות</title>
    <link rel="icon" href="../images/transparent logo.png" type="image/png">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzm8NEZTrhZ_bcosd4vcRWKgnlze14lJA",
            authDomain: "lev-katan.firebaseapp.com",
            projectId: "lev-katan",
            storageBucket: "lev-katan.firebasestorage.app",
            messagingSenderId: "1092225971684",
            appId: "1:1092225971684:web:43dac4235e36220abd43f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.auth = auth; // Expose for functions
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    </script>

    <style>
        :root {
            --bg-gradient-light: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 50%, #FFE4E1 100%);
            --bg-gradient-dark: linear-gradient(135deg, #2c1e21 0%, #4a2c36 50%, #2c2c2c 100%);
            --container-bg: white;
            --text-color: #333;
            --input-bg: #FAFAFA;
            --input-border: #FFE4E9;
            --header-bg: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
            --card-bg: white;
        }

        body.dark-mode {
            --bg-gradient-light: var(--bg-gradient-dark);
            /* Swap gradient */
            --container-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --input-bg: #2D2D2D;
            --input-border: #444;
            --card-bg: #1E1E1E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient-light);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s;
        }

        .container {
            background: var(--container-bg);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: var(--header-bg);
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            /* Left side because RTL */
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 15px;
            transition: 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .logo-img {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background: white;
            padding: 5px;
        }

        .site-name {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .tagline {
            font-size: 16px;
            opacity: 0.95;
            font-weight: 300;
        }

        .tabs {
            display: flex;
            background: var(--input-bg);
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .tab.active {
            color: #FF69B4;
            background: var(--container-bg);
            border-bottom-color: #FF69B4;
        }

        .form-container {
            padding: 40px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 26px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            opacity: 0.8;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-color);
        }

        input:focus {
            border-color: #FF69B4;
            background: var(--container-bg);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
        }

        .success-message {
            display: none;
            background: #D4F4DD;
            color: #1E7E34;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #A8E6B7;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .info-box {
            background: rgba(255, 249, 230, 0.5);
            border: 2px solid #FFE4B3;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            color: #856404;
            font-size: 14px;
            text-align: center;
        }

        body.dark-mode .info-box {
            background: #332b00;
            border-color: #665200;
            color: #ffd633;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }

        /* Floating Help Button */
        .btn-help-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--brand-pink);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            font-size: 28px;
            cursor: pointer;
            z-index: 999;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-help-float:hover {
            transform: scale(1.1);
        }

        /* Unified Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--input-border);
            text-align: right;
            animation: fadeInScale 0.3s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
            transition: 0.2s;
            z-index: 10;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        /* Styling for injected help content */
        .help-section h3 {
            color: var(--brand-pink);
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .help-section p,
        .help-section li {
            line-height: 1.6;
            margin-bottom: 10px;
            color: var(--text-color);
            opacity: 0.9;
        }

        .help-section details {
            background: rgba(0, 0, 0, 0.03);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .help-section summary {
            font-weight: bold;
            color: var(--text-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <button class="theme-toggle" onclick="toggleTheme()" title="מצב מוחשך" id="themeBtn">🌓</button>
            <img src="../images/logo.png" alt="Lev Katan Logo" class="logo-img">
            <div class="site-name">לב קטן</div>
            <div class="tagline">גמ"ח להשאלת מוצרי תינוקות ללא עלות</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">התחברות</div>
            <div class="tab" onclick="switchTab('register')">הרשמה</div>
        </div>

        <div class="form-container">
            <div id="loginForm" class="form-section active">
                <h2>ברוכים השבים</h2>
                <p class="subtitle">הזינו את פרטי ההתחברות שלכם</p>
                <div id="loginSuccess" class="success-message"></div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>כתובת מייל</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>סיסמה</label>
                        <input type="password" id="loginPassword" required minlength="6">
                    </div>
                    <button type="submit" class="submit-btn">התחברות</button>
                </form>
            </div>

            <div id="registerForm" class="form-section">
                <h2>הצטרפות לקהילה</h2>
                <p class="subtitle">מלאו את הפרטים שלכם כדי להתחיל</p>
                <div class="info-box">הצטרפו אלינו ותוכלו להשאיל מוצרים בחינם</div>
                <div id="registerSuccess" class="success-message">✓ נרשמתם בהצלחה!</div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>שם מלא</label>
                        <input type="text" id="fullName" required minlength="2">
                    </div>
                    <div class="form-group">
                        <label>שם משתמש</label>
                        <input type="text" id="username" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label>מספר טלפון</label>
                        <input type="tel" id="phone_number" required>
                    </div>
                    <div class="form-group">
                        <label>כתובת מייל</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>סיסמה</label>
                        <input type="password" id="registerPassword" required minlength="6">
                    </div>
                    <button type="submit" class="submit-btn">הרשמה</button>
                </form>
            </div>
        </div>
    </div>

    <button class="btn-help-float" onclick="openHelpModal()">❓</button>

    <div id="helpModal" class="modal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeHelpModal()">&times;</span>
            <h2 style="color:var(--text-color); margin-bottom:15px; text-align:center;">מרכז עזרה ומידע</h2>
            <div id="helpContent">
                <p style="text-align:center;">טוען מידע...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://levkatan.onrender.com/api";

        // --- Theme Logic ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if (tab === 'login') document.getElementById('loginForm').classList.add('active');
            else document.getElementById('registerForm').classList.add('active');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                // 1. Login to Firebase Auth directly from the browser
                const userCredential = await window.signInWithEmailAndPassword(window.auth, email, password);
                const token = await userCredential.user.getIdToken();

                // 2. Save the secure token
                localStorage.setItem('userToken', token);

                // 3. Ask the Python Backend for the user's role (Admin, Employee, User)
                const profileRes = await fetch(`${API_URL}/user/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (profileRes.ok) {
                    const userData = await profileRes.json();
                    localStorage.setItem('userRole', userData.role);
                    localStorage.setItem('username', userData.username);

                    const successMsg = document.getElementById('loginSuccess');
                    successMsg.innerText = `✓ שלום ${userData.username}, התחברת בהצלחה!`;
                    successMsg.classList.add('show');

                    // 4. Send them to the correct dashboard
                    setTimeout(() => {
                        if (userData.role === 'admin') window.location.href = 'admin_dashboard.html';
                        else if (userData.role === 'employee') window.location.href = 'employee_dashboard.html';
                        else window.location.href = 'user_dashboard.html';
                    }, 1000);
                } else {
                    alert("שגיאה במשיכת נתוני משתמש מהשרת");
                }
            } catch (error) {
                console.error(error);
                alert("Login Failed: פרטים שגויים");
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                // 1. Create the user in Firebase Auth FIRST
                const userCredential = await window.createUserWithEmailAndPassword(window.auth, email, password);
                const uid = userCredential.user.uid;

                // 2. Send the extra details (Name, Phone) AND the UID to the Python backend
                const formData = {
                    uid: uid,
                    email: email,
                    fullName: document.getElementById('fullName').value,
                    username: document.getElementById('username').value,
                    phone_number: document.getElementById('phone_number').value
                };

                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const successMsg = document.getElementById('registerSuccess');
                    successMsg.classList.add('show');
                    setTimeout(() => { successMsg.classList.remove('show'); switchTab('login'); }, 2000);
                } else {
                    const err = await response.json();
                    alert("שגיאה מול השרת: " + (err.message || "נסה שוב"));
                }
            } catch (error) {
                console.error(error);
                alert("Registration Failed: " + error.message);
            }
        }

        // --- Help Modal Logic ---
        async function openHelpModal() {
            document.getElementById('helpModal').style.display = 'flex';
            const contentDiv = document.getElementById('helpContent');

            if (contentDiv.innerHTML.includes('טוען מידע')) {
                try {
                    const response = await fetch('help/login_help.html');
                    if (response.ok) {
                        const html = await response.text();
                        contentDiv.innerHTML = html;
                    } else {
                        contentDiv.innerHTML = "<p>שגיאה בטעינת קובץ העזרה.</p>";
                    }
                } catch (e) {
                    contentDiv.innerHTML = "<p>שגיאה בטעינת המידע. אנא נסה שנית.</p>";
                }
            }
        }

        function closeHelpModal() {
            document.getElementById('helpModal').style.display = 'none';
        }

        function closeModalOnOutside(event) {
            if (event.target === document.getElementById('helpModal')) {
                closeHelpModal();
            }
        }
    </script>
</body>

</html>
