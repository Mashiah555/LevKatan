<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עמוד לא נמצא - לב קטן</title>

  <style>
    /* Fallback 404-specific styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark Mode Support */
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    .error-container {
      max-width: 500px;
      padding: 50px 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    body.dark-mode .error-container {
      background: #1e1e1e;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .error-code {
      font-size: 100px;
      font-weight: bold;
      margin: 0;
      color: #FF66A3;
      /* Brand Pink */
      line-height: 1;
      text-shadow: 2px 2px 4px rgba(255, 102, 163, 0.2);
    }

    .error-title {
      font-size: 28px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    body.dark-mode .error-message {
      color: #aaa;
    }

    .btn-home {
      display: inline-block;
      padding: 12px 30px;
      background-color: #FF66A3;
      /* Brand Pink */
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(255, 102, 163, 0.3);
    }

    .btn-home:hover {
      background-color: #E64D8E;
      /* Slightly darker pink for hover effect */
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(255, 102, 163, 0.4);
    }

    /* Top-right theme toggle to match Hebrew RTL layout */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <button class="theme-toggle" onclick="toggleTheme()" title="החלף עיצוב">🌓</button>

  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">אופס! נראה שהלכת לאיבוד...</h2>
    <p class="error-message">הדף שחיפשת לא נמצא.<br>אולי הוא כבר מושאל לאיזה תינוק קטן, או שהכתובת שגויה.</p>

    <a href="/" class="btn-home">חזרה לדף הבית</a>
  </div>

  <script>
    // Theme logic
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>

</html>
